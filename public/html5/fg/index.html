            try {

      function syncVisualViewport() {
        var viewport = window.visualViewport;
        var width = Math.round(viewport ? viewport.width : window.innerWidth);
        var height = Math.round(viewport ? viewport.height : window.innerHeight);
        document.documentElement.style.setProperty('--fg-viewport-width', width + 'px');
        document.documentElement.style.setProperty('--fg-viewport-height', height + 'px');
        window.scrollTo(0, 0);
      }

      syncVisualViewport();
      window.addEventListener('resize', syncVisualViewport, { passive: true });
      window.addEventListener('orientationchange', syncVisualViewport, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncVisualViewport, { passive: true });
        window.visualViewport.addEventListener('scroll', syncVisualViewport, { passive: true });
      }
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (eventName) {
        document.addEventListener(eventName, function (event) { event.preventDefault(); }, { passive: false });
      });
      document.addEventListener('touchmove', function (event) {
        if (event.touches && event.touches.length > 1) event.preventDefault();
      }, { passive: false });
      document.addEventListener('wheel', function (event) {
        if (event.ctrlKey) event.preventDefault();
      }, { passive: false });
      document.addEventListener('focusout', function () {
        requestAnimationFrame(syncVisualViewport);
      });

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }
